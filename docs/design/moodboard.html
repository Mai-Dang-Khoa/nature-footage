<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodboard — 6 hero frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..600&family=Inter:wght@400;600&family=Fraunces:opsz,wght@9..144,300&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { padding: 48px; background: #fff; color: #1d1d1f; font: 400 14px/1.4 Inter, system-ui, sans-serif; }
  h1 { font: 600 24px Inter; margin-bottom: 24px; }
  .board { display: grid; grid-template-columns: repeat(3, 480px); gap: 32px; }
  figure { display: grid; gap: 8px; }
  figcaption b { font-weight: 600; }
  /* each frame is a 1440×900 page drawn at 1/3 scale */
  .f { position: relative; width: 480px; height: 300px; overflow: hidden; }
  .f img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .nav { height: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 5px; }
  .disp { font: 600 27px/1.06 Archivo; font-stretch: 87.5%; letter-spacing: -.025em; }
  .sub { font-size: 6px; opacity: .8; }
  .pill { display: inline-block; height: 14px; padding: 0 7px; border-radius: 980px; background: #0071e3; color: #fff; font: 600 5px/14px Inter; }
  .dark { background: #000; color: #f5f5f7; }
  .light { background: #f5f5f7; color: #1d1d1f; }
  .paper { background: #efebe3; color: #1d1d1f; }
  .chosen { outline: 3px solid #0071e3; outline-offset: 4px; }
</style>
</head>
<body>
<h1>Moodboard: 6 hero frames (1440 × 900, drawn at 1/3)</h1>
<div class="board">
  <figure>
    <div class="f dark chosen" style="display:flex;flex-direction:column">
      <div class="nav"><span>Wild Frames</span><span>Clips · Process · FAQ</span></div>
      <div style="text-align:center;padding:12px 0 10px;display:grid;gap:5px;justify-items:center">
        <div class="disp">Nature, rendered.</div>
        <div class="sub">Photoreal 4K stock footage, built in Unreal Engine 5.</div>
        <span class="pill">Browse clips</span>
      </div>
      <img src="../../assets/thumbs/sample-3.svg" alt="" style="flex:1;min-height:0">
    </div>
    <figcaption><b>A — chosen.</b> Product-cinematic. Black, centred line, full-bleed footage below (65% of the first screen).</figcaption>
  </figure>
  <figure>
    <div class="f dark" style="display:flex;flex-direction:column">
      <div class="nav"><span>Wild Frames</span><span>Clips · Process · FAQ</span></div>
      <img src="../../assets/thumbs/sample-2.svg" alt="" style="flex:1;min-height:0">
      <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:end">
        <div class="disp" style="font-size:22px">Nature, rendered.</div><span class="pill">Browse clips</span>
      </div>
    </div>
    <figcaption><b>B.</b> Footage first, line under it. Strong, but the promise lands after the picture.</figcaption>
  </figure>
  <figure>
    <div class="f light" style="display:flex;flex-direction:column">
      <div class="nav"><span>Wild Frames</span><span>Clips · Process · FAQ</span></div>
      <div style="text-align:center;padding:14px 0;display:grid;gap:5px;justify-items:center">
        <div class="disp">Nature, rendered.</div><span class="pill">Browse clips</span>
      </div>
      <div style="flex:1;padding:0 48px;min-height:0"><img src="../../assets/thumbs/sample-1.svg" alt="" style="border-radius:6px"></div>
    </div>
    <figcaption><b>C.</b> Light hero, framed footage. Footage loses depth on grey; under 60%.</figcaption>
  </figure>
  <figure>
    <div class="f paper" style="padding:16px;display:grid;grid-template-columns:7fr 5fr;gap:12px">
      <img src="../../assets/thumbs/sample-4.svg" alt="">
      <div style="align-self:end;display:grid;gap:4px">
        <div style="font:300 18px/1.1 Fraunces">Nature, rendered.</div>
        <div class="sub">Plate 01 — Sky, dusk.</div>
      </div>
    </div>
    <figcaption><b>D.</b> Editorial-gallery. Paper, asymmetric. Calm, but stock buyers scan for footage, not plates.</figcaption>
  </figure>
  <figure>
    <div class="f paper" style="padding:16px 16px 0;display:grid;grid-template-rows:auto 1fr;gap:10px">
      <div style="font:300 22px/1.1 Fraunces">Nature, rendered.</div>
      <div style="display:grid;grid-template-columns:5fr 3fr 4fr;gap:8px;align-items:start">
        <img src="../../assets/thumbs/sample-5.svg" alt="" style="height:140px"><img src="../../assets/thumbs/sample-6.svg" alt="" style="height:90px;margin-top:40px"><img src="../../assets/thumbs/sample-2.svg" alt="" style="height:110px"></div>
    </div>
    <figcaption><b>E.</b> Editorial wall. Many small images, no single hero shot.</figcaption>
  </figure>
  <figure>
    <div class="f dark" style="display:grid;grid-template-columns:5fr 7fr">
      <div style="padding:60px 16px;display:grid;gap:6px;align-content:start">
        <div class="disp" style="font-size:24px">Nature, rendered.</div>
        <div class="sub">Photoreal 4K stock footage.</div><span class="pill" style="justify-self:start">Browse clips</span>
      </div>
      <img src="../../assets/thumbs/sample-6.svg" alt="">
    </div>
    <figcaption><b>F.</b> Split. Text left, footage bleeds right. Footage under 60%.</figcaption>
  </figure>
</div>
</body>
</html>
