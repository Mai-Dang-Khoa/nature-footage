<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wild Frames — 4K Nature Stock Footage Made in Unreal Engine 5</title>
  <meta name="description" content="Photoreal 4K nature stock footage created in Unreal Engine 5: forests, oceans, mountains, skies and waterfalls. Preview clips and license on Adobe Stock.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://mai-dang-khoa.github.io/nature-footage/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Wild Frames — 4K Nature Stock Footage">
  <meta property="og:description" content="Photoreal 4K nature clips created in Unreal Engine 5. Preview and license on Adobe Stock.">
  <meta property="og:url" content="https://mai-dang-khoa.github.io/nature-footage/">
  <meta property="og:image" content="https://mai-dang-khoa.github.io/nature-footage/assets/og.png">
  <meta property="og:site_name" content="Wild Frames">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wild Frames — 4K nature footage made in Unreal Engine 5">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wild Frames — 4K Nature Stock Footage">
  <meta name="twitter:description" content="Photoreal 4K nature clips created in Unreal Engine 5. Preview and license on Adobe Stock.">
  <meta name="twitter:image" content="https://mai-dang-khoa.github.io/nature-footage/assets/og.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,600&family=Inter:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5,600&family=Inter:wght@400;600&display=swap"></noscript>
  <link rel="preload" as="image" href="assets/flight/desktop/f_0001.webp" media="(orientation: landscape)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/flight/mobile/f_0001.webp" media="(orientation: portrait)" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=dev">
  <script>
    (function (d) {
      d.classList.add("js");
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      // static page (4 stills) when motion is reduced; decided before first paint
      d.classList.add(reduce ? "still" : "fly");
    })(document.documentElement);
  </script>
</head>
<body>
  <a class="skip" href="#end">Skip to licensing</a>
  <header class="bar">
    <a class="logo" href="#top">Wild Frames</a>
    <button class="sound" id="sound" type="button" aria-pressed="false" hidden>Sound off</button>
  </header>

  <main id="top">
    <!-- One shot: scrolling is the timeline. The stage stays pinned while the camera flies. -->
    <div class="flight" id="flight">
      <div class="stage" id="stage">
        <img class="scene-first" id="scene-first" src="assets/flight/desktop/f_0001.webp" alt="" width="1280" height="720" fetchpriority="high">
        <canvas class="scene" id="scene" role="img" aria-label="Camera flight over a forest, a river and mountains while the weather changes"></canvas>
        <div class="wx wx-rain" aria-hidden="true"></div>
        <canvas class="rain" id="rain" aria-hidden="true"></canvas>
        <div class="wx wx-after" aria-hidden="true"><div class="mist" id="mist"></div></div>
        <div class="wx wx-golden" aria-hidden="true"></div>
        <div class="wx wx-stars" aria-hidden="true"><canvas class="stars" id="stars"></canvas></div>
        <div class="flash" id="flash" aria-hidden="true"></div>

        <div class="lines" id="lines">
          <h1 class="line line-hero" data-a="0" data-b="0.12">Nature, rendered.</h1>
          <p class="line" data-a="0.18" data-b="0.28">Heavy rain. No people.</p>
          <p class="line" data-a="0.40" data-b="0.50">Seamless loop. First frame matches the last.</p>
          <p class="line" data-a="0.62" data-b="0.72">4K, rendered in Unreal Engine 5.</p>
          <p class="line line-end" data-a="0.88" data-b="1.01">Find the shot. License it.</p>
        </div>

        <div class="frames" id="frames"></div>
      </div>
      <span class="end-mark" id="end" tabindex="-1"></span>
    </div>

    <!-- Phones: clips stacked under the flight. Reduced motion: four stills, each with its clips. -->
    <div class="list" id="list"></div>
  </main>

  <script src="data.js?v=dev" defer></script>
  <script src="flight.js?v=dev" defer></script>
</body>
</html>
