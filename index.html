  <link rel="stylesheet" href="style.css">
  <script>
    (function (d) {
      d.classList.add("js");
      // Hero text fades in once web fonts are ready (max 900ms), so the swap never moves it.
      var done = function () { d.classList.add("fonts-ready"); };
      setTimeout(done, 900);
      window.fontsGo = function () {
        if (!document.fonts || !document.fonts.load) return done();
        Promise.all(["600 1em Archivo", "400 1em Inter"].map(function (f) { return document.fonts.load(f); })).then(done, done);
      };
      // safety net: if motion.js never loads, show everything
      setTimeout(function () { if (!window.Motion) d.classList.remove("js"); }, 4000);
    })(document.documentElement);
  </script>
